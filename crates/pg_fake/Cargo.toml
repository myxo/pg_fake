[package]
name = "pg_fake"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
execution-log = ["dep:tracing"]

[dependencies]
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
rand_chacha = { version = "0.9", features = ["os_rng"] }
serde = "1"
serde_json = { version = "1", features = ["arbitrary_precision", "unbounded_depth"] }
sqlparser = { version = "0.62", features = ["visitor"] }
thiserror = "2"
tracing = { version = "0.1", optional = true, features = ["attributes"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
chaos_theory = "0.5"
dotenvy = "0.15"
postgres = "0.19"
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["blocking", "postgres"] }
