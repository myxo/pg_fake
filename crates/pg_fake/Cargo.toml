[package]
name = "pg_fake"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bigdecimal = "0.4"
sqlparser = { version = "0.53", features = ["visitor"] }
thiserror = "2"

[dev-dependencies]
chaos_theory = "0.3.5"
criterion = "0.5"
postgres = "0.19"
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["blocking", "postgres"] }

[[bench]]
name = "workloads"
harness = false
