[package]
name = "pg_fake_benchmarks"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dev-dependencies]
criterion = "0.5"
dotenvy = "0.15"
pg_fake = { path = "../pg_fake" }
pg_fake_sqlx = { path = "../pg_fake_sqlx", features = ["time"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio"] }
sqlx-core = { version = "0.8.6", features = ["migrate"] }
sqlx-postgres = { version = "0.8.6", features = ["migrate", "time"] }
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["blocking", "postgres"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "workloads"
harness = false
