[package]
name = "pg_fake_cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
execution-log = ["pg_fake/execution-log", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
pg_fake = { path = "../pg_fake" }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[[bin]]
name = "trace_simple_queries"
path = "src/bin/trace_simple_queries.rs"
required-features = ["execution-log"]
